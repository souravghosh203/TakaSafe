<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" style="background-color: #080808; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#141414" stroke-width="1"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Card Shadow -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <!-- Radar Sector Sweep Gradient -->
    <linearGradient id="sweep-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ccff00" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ccff00" stop-opacity="0"/>
    </linearGradient>

    <style>
      /* Radar Sweep Spin Animation around Center (660, 220) */
      @keyframes radar-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      
      /* Threat Node Pulsing */
      @keyframes threat-pulse {
        0%, 100% { r: 5px; opacity: 1; }
        50% { r: 8px; opacity: 0.4; }
      }

      /* Mule Intercept Flow Lines */
      @keyframes dash-flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }

      /* Intercept Shield Glow */
      @keyframes shield-glow {
        0%, 100% { filter: drop-shadow(0px 0px 4px #ccff00); }
        50% { filter: drop-shadow(0px 0px 10px #ccff00); }
      }

      /* NFC Contactless Wave Signal */
      @keyframes wave-pulse {
        0%, 100% { opacity: 0.2; stroke: #666666; }
        50% { opacity: 1; stroke: #ccff00; }
      }

      .radar-sweep-element {
        animation: radar-spin 3s linear infinite;
        transform-origin: 660px 220px;
      }

      .threat-node {
        animation: threat-pulse 1.8s infinite ease-in-out;
      }

      .flow-path {
        stroke-dasharray: 6 6;
        animation: dash-flow 1s linear infinite;
      }

      .intercept-shield {
        animation: shield-glow 2s infinite;
      }

      .wave-1 { animation: wave-pulse 1.5s infinite 0s; }
      .wave-2 { animation: wave-pulse 1.5s infinite 0.3s; }
    </style>
  </defs>

  <!-- Background Grid -->
  <rect width="1200" height="630" fill="#080808"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- LEFT SECTION: Branding & Information -->
  <g transform="translate(80, 0)">
    <!-- Header Badge -->
    <g transform="translate(0, 110)">
      <rect x="0" y="0" width="220" height="30" rx="15" fill="#111111" stroke="#222222" stroke-width="1"/>
      <circle cx="16" cy="15" r="4" fill="#ccff00" filter="url(#glow)"/>
      <text x="30" y="19" fill="#888888" font-size="11" font-weight="600" letter-spacing="1">AI FINANCIAL TRUST &amp; RESILIENCE</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 185)">
      <text x="0" y="0" fill="#ffffff" font-size="44" font-weight="800" letter-spacing="-1">TakaSafe</text>
      <text x="185" y="-24" fill="#ccff00" font-size="12" font-weight="700" letter-spacing="1">v2.5</text>
      <text x="0" y="32" fill="#aaaaaa" font-size="18" font-weight="400">Explainable AI Fraud Shield &amp; Mule Syndicate Defense</text>
      <text x="0" y="56" fill="#555555" font-size="13" font-weight="400">Engineered for MFS Architecture • &lt; 18ms SLA • BFIU STR Compliance</text>
    </g>

    <!-- Feature Badges -->
    <g transform="translate(0, 290)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="125" height="36" rx="18" fill="#121212" stroke="#262626" stroke-width="1"/>
      <path d="M 22 18 L 25 12 L 23 24 L 27 18" stroke="#ccff00" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text x="35" y="22" fill="#dddddd" font-size="12" font-weight="600">&lt; 18ms SLA</text>

      <!-- Badge 2 -->
      <rect x="135" y="0" width="145" height="36" rx="18" fill="#121212" stroke="#262626" stroke-width="1"/>
      <circle cx="152" cy="18" r="4" fill="#ccff00"/>
      <text x="164" y="22" fill="#dddddd" font-size="12" font-weight="600">ScamShield AI</text>

      <!-- Badge 3 -->
      <rect x="290" y="0" width="155" height="36" rx="18" fill="#121212" stroke="#262626" stroke-width="1"/>
      <polygon points="308,14 313,22 303,22" fill="#ccff00"/>
      <text x="321" y="22" fill="#dddddd" font-size="12" font-weight="600">MuleVision GNN</text>
    </g>

    <!-- Tech Specs Footer -->
    <g transform="translate(0, 365)">
      <text x="0" y="0" fill="#444444" font-size="11" font-weight="600" letter-spacing="1">POWERED BY</text>
      <text x="85" y="0" fill="#666666" font-size="11" font-weight="500">XGBoost • Isolation Forest • SHAP • Gemini 2.5 • D3.js</text>
    </g>
  </g>

  <!-- Connection Line (Radar to Intercept Panel) -->
  <path d="M 660 300 C 660 350, 680 370, 710 370" fill="none" stroke="#ccff00" stroke-width="1.5" class="flow-path" opacity="0.4"/>

  <!-- RIGHT SECTION 1: Multimodal Threat Radar -->
  <g transform="translate(560, 90)" filter="url(#card-shadow)">
    <!-- Container -->
    <rect x="0" y="0" width="200" height="260" rx="12" fill="#0d0d0d" stroke="#1f1f1f" stroke-width="1"/>
    
    <!-- Title Bar -->
    <circle cx="16" cy="20" r="4" fill="#ccff00"/>
    <text x="26" y="24" fill="#ffffff" font-size="11" font-weight="700">Multimodal Threat Radar</text>
    <line x1="0" y1="38" x2="200" y2="38" stroke="#161616" stroke-width="1"/>

    <!-- Radar Screen (Center: Global 660, 220) -->
    <g transform="translate(100, 130)">
      <!-- Concentric Rings -->
      <circle cx="0" cy="0" r="75" fill="none" stroke="#1e2605" stroke-width="1"/>
      <circle cx="0" cy="0" r="50" fill="none" stroke="#1e2605" stroke-width="1"/>
      <circle cx="0" cy="0" r="25" fill="none" stroke="#1e2605" stroke-width="1"/>
      
      <!-- Axis Lines -->
      <line x1="-80" y1="0" x2="80" y2="0" stroke="#1a1a1a" stroke-width="1"/>
      <line x1="0" y1="-80" x2="0" y2="80" stroke="#1a1a1a" stroke-width="1"/>

      <!-- Static Nodes -->
      <circle cx="-30" cy="-20" r="3" fill="#ffffff" opacity="0.3"/>
      <circle cx="20" cy="-45" r="3" fill="#ffffff" opacity="0.4"/>

      <!-- Target Threat Point -->
      <circle cx="35" cy="30" r="5" fill="#ccff00" class="threat-node" filter="url(#glow)"/>
      <circle cx="35" cy="30" r="10" fill="none" stroke="#ccff00" stroke-width="1" opacity="0.6"/>
    </g>

    <text x="100" y="242" text-anchor="middle" fill="#ccff00" font-size="10" font-weight="700" letter-spacing="0.5">ACTIVE THREAT DETECTED</text>
  </g>

  <!-- ROTATING RADAR SWEEP (Rotates precisely around center X=660, Y=220) -->
  <g class="radar-sweep-element">
    <path d="M 660 220 L 735 220 A 75 75 0 0 0 660 145 Z" fill="url(#sweep-gradient)"/>
    <line x1="660" y1="220" x2="735" y2="220" stroke="#ccff00" stroke-width="1.5" filter="url(#glow)"/>
  </g>

  <!-- RIGHT SECTION 2: Payment Card (Centurion / upay) -->
  <g transform="translate(730, 60)" filter="url(#card-shadow)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="260" height="150" rx="12" fill="#121212" stroke="#282828" stroke-width="1"/>
    
    <!-- Branding -->
    <text x="20" y="28" fill="#555555" font-size="9" font-weight="700" letter-spacing="1">SOVEREIGN CENTURION</text>
    <text x="210" y="28" fill="#ffffff" font-size="11" font-weight="800" font-style="italic">upay</text>

    <!-- Metallic Chip -->
    <rect x="20" y="44" width="26" height="18" rx="3" fill="#222222" stroke="#3a3a3a" stroke-width="1"/>
    <line x1="20" y1="53" x2="46" y2="53" stroke="#121212" stroke-width="1"/>

    <!-- Contactless Wave Signals (Animated) -->
    <g transform="translate(52, 45)">
      <path d="M 2 4 A 8 8 0 0 1 2 12" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round" class="wave-1"/>
      <path d="M 6 1 A 13 13 0 0 1 6 15" fill="none" stroke="#888888" stroke-width="1.5" stroke-linecap="round" class="wave-2"/>
    </g>

    <!-- Card Number -->
    <text x="20" y="94" fill="#ffffff" font-size="14" font-weight="600" letter-spacing="3">•••• 8829 4410 9021</text>

    <!-- Details -->
    <text x="20" y="122" fill="#444444" font-size="8" font-weight="600">CARDHOLDER</text>
    <text x="20" y="132" fill="#888888" font-size="9" font-weight="600">TAKASAFE SCAMSHIELD</text>

    <text x="180" y="122" fill="#444444" font-size="8" font-weight="600" text-anchor="end">BALANCE</text>
    <text x="240" y="133" fill="#ccff00" font-size="11" font-weight="700" text-anchor="end">৳ 2,450,000</text>
  </g>

  <!-- RIGHT SECTION 3: Mule Outflow Intercept Panel -->
  <g transform="translate(680, 260)" filter="url(#card-shadow)">
    <!-- Container -->
    <rect x="0" y="0" width="300" height="230" rx="12" fill="#0a0a0a" stroke="#ccff00" stroke-width="1.5"/>

    <!-- Header Alert -->
    <rect x="12" y="12" width="60" height="18" rx="4" fill="#ccff00"/>
    <text x="42" y="24" fill="#000000" font-size="10" font-weight="800" text-anchor="middle">CRIT: 94</text>
    <text x="80" y="26" fill="#ffffff" font-size="13" font-weight="700">Mule Outflow Intercept</text>

    <!-- SHAP Metrics -->
    <g transform="translate(16, 55)">
      <text x="0" y="10" fill="#888888" font-size="11" font-weight="500">• SHAP: <tspan fill="#ffffff" font-weight="700">+31% Circadian Spike</tspan></text>
      <text x="0" y="28" fill="#888888" font-size="11" font-weight="500">• SHAP: <tspan fill="#ffffff" font-weight="700">+24% Velocity Burst</tspan></text>
    </g>

    <!-- Intercept Flow Visual -->
    <g transform="translate(16, 110)">
      <text x="0" y="0" fill="#555555" font-size="10" font-weight="700" letter-spacing="0.5">INTERCEPT PATH</text>
      
      <g transform="translate(0, 15)">
        <!-- MFS Node -->
        <circle cx="20" cy="20" r="14" fill="#141414" stroke="#333333" stroke-width="1"/>
        <text x="20" y="23" fill="#888888" font-size="9" font-weight="700" text-anchor="middle">MFS</text>

        <!-- Dynamic Intercept Flow Line -->
        <line x1="34" y1="20" x2="80" y2="20" stroke="#ccff00" stroke-width="2" class="flow-path"/>

        <!-- Shield Node -->
        <circle cx="95" cy="20" r="16" fill="#ccff00" class="intercept-shield"/>
        <path d="M 91 15 L 99 15 L 99 20 C 99 24 91 26 91 26 C 91 26 83 24 83 20 L 83 15 Z" fill="#000000" transform="translate(4, -1) scale(0.7)"/>

        <!-- Line to Blocked Node -->
        <line x1="111" y1="20" x2="155" y2="20" stroke="#444444" stroke-width="1.5"/>
        <line x1="130" y1="12" x2="138" y2="28" stroke="#ff3333" stroke-width="2"/>

        <!-- Mule Node (Blocked) -->
        <circle cx="170" cy="20" r="14" fill="#141414" stroke="#ff3333" stroke-width="1"/>
        <text x="170" y="23" fill="#ff3333" font-size="8" font-weight="700" text-anchor="middle">MULE</text>
      </g>
    </g>

    <!-- Action Bar -->
    <g transform="translate(14, 180)">
      <rect x="0" y="0" width="272" height="34" rx="6" fill="#111803" stroke="#253805" stroke-width="1"/>
      <path d="M 12 17 L 16 21 L 24 13" fill="none" stroke="#ccff00" stroke-width="2" stroke-linecap="round"/>
      <text x="32" y="21" fill="#ccff00" font-size="11" font-weight="700">Action: Automated BFIU Form 2 STR Generated</text>
    </g>
  </g>

  <!-- GLOBAL FOOTER -->
  <g transform="translate(80, 580)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#161616" stroke-width="1"/>
    <text x="0" y="22" fill="#444444" font-size="10" font-weight="600" letter-spacing="0.5">REGULATORY ASSURANCE:</text>
    <text x="140" y="22" fill="#666666" font-size="10" font-weight="500">BANGLADESH BANK PSD CIRCULAR 12 • ANTI-MONEY LAUNDERING ACT 2012 (SEC 19) • ZERO-COLD-START ML</text>
    <text x="1040" y="22" fill="#ccff00" font-size="10" font-weight="700" text-anchor="end">DIU CPC x UPAY HACKATHON 2026</text>
  </g>
</svg>
